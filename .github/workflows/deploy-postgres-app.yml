name: deploy-postgres-app.yml
on:
  workflow_call:
    inputs:
      template_app_name:
        required: true
        type: string
      docker_image:
        required: true
        type: string
    secrets:
      HOST_URL:
        required: true
      INTERNAL_HOST_URL:
        required: true
      PORT:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write
  actions: read
  contents: read
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install opkssh
        run: curl -sSLf https://raw.githubusercontent.com/openpubkey/opkssh/main/scripts/install-linux.sh | sudo bash

      - name: Login
        run: opkssh login github

      - name: SSH into server
        env:
          HOST_URL: ${{ secrets.HOST_URL }}
          INTERNAL_HOST_URL: ${{ secrets.INTERNAL_HOST_URL }}
          PORT: ${{ secrets.PORT }}
          TEMPLATE_APP_NAME: ${{ inputs.template_app_name }}
          REVIEW_APP_NAME: ${{ github.event.pull_request.head.repo.name }}-review-${{ github.event.pull_request.number }}
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          ssh -o "StrictHostKeyChecking=accept-new" -p $PORT -J "actions@$HOST_URL" "actions@$INTERNAL_HOST_URL" "deploy" "$TEMPLATE_APP_NAME" "$REVIEW_APP_NAME" "$DOCKER_IMAGE"
