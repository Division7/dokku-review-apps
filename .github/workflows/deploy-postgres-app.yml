name: deploy-postgres-app.yml
on:
  workflow_call:
    inputs:
      template_app_name:
        required: true
        type: string
      docker_image:
        required: true
        type: string
    secrets:
      HOST_URL:
        required: true
      PORT:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write
  actions: read
  contents: read
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install opkssh
        run: curl -sSLf https://raw.githubusercontent.com/openpubkey/opkssh/main/scripts/install-linux.sh | sudo bash

      - name: Login
        run: opkssh login github

      - name: SSH into server
        env:
          HOST_URL: ${{ secrets.HOST_URL }}
          PORT: ${{ secrets.PORT }}
          TEMPLATE_APP_NAME: ${{ inputs.template_app_name }}
          REVIEW_APP_NAME: ${{ github.event.pull_request.head.repo.name }}-review-${{ github.event.pull_request.number }}
          DOCKER_IMAGE: ${{ inputs.docker_image }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p $PORT "actions@$HOST_URL" "TEMPLATE_APP_NAME='$TEMPLATE_APP_NAME' REVIEW_APP_NAME='$REVIEW_APP_NAME' DOCKER_IMAGE='$DOCKER_IMAGE' bash -s" << 'EOF'
          if dokku apps:exists "$REVIEW_APP_NAME"; then 
            dokku git:from-image "$REVIEW_APP_NAME" "$DOCKER_IMAGE" --build
            exit 0;
          fi
          
          if ! dokku apps:exists "$TEMPLATE_APP_NAME"; then
            echo "::error::ERROR: App template to create review-apps $TEMPLATE_APP_NAME does not exist" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          LINKED_DATABASES=$(dokku postgres:app-links "$TEMPLATE_APP_NAME")
          DB_COUNT=$(echo "$LINKED_DATABASES" | wc -l)
          CLONED_DATABASES=()
          
          if [[ -z "$LINKED_DATABASES" ]]; then
            echo "::warning::warning: App template to create review-apps $TEMPLATE_APP_NAME does not have linked databases. Continuing..." 
          elif [[ "$DB_COUNT" -gt 1 ]]; then
            echo "::warning::warning: App template to create review-apps $TEMPLATE_APP_NAME has more than one linked database. Continuing..." 
            DB_COUNTER=1
            for DATABASE_NAME in $LINKED_DATABASES"; do
              dokku postgres:clone "$DATABASE_NAME" "${REVIEW_APP_NAME}_DB_$DB_COUNTER"
              CLONED_DATABASES+=("$REVIEW_APP_NAME_DB_$DB_COUNTER")
              DB_COUNTER=$((DB_COUNTER+1))
            done
          else
            for DATABASE_NAME in $LINKED_DATABASES"; do
              dokku postgres:clone "$DATABASE_NAME" "${REVIEW_APP_NAME}_DB"
              CLONED_DATABASES+=("$REVIEW_APP_NAME_DB")
            done
          fi
          
          dokku apps:clone "$TEMPLATE_APP_NAME" "$REVIEW_APP_NAME" --skip-deploy
          for DATABASE_NAME in "$LINKED_DATABASES"; do 
            dokku postgres:unlink --no-restart "$DATABASE_NAME" "$REVIEW_APP_NAME" 
          done
          
          for DATABASE_NAME in "${CLONED_DATABASES[@]}"; do
            dokku postgres:link --no-restart "$DATABASE_NAME" "$REVIEW_APP_NAME"
          done
          
          dokku git:from-image "$REVIEW_APP_NAME" "$DOCKER_IMAGE" --build
          
          dokku letsencrypt:set "$REVIEW_APP_NAME" email djensen@ucsb.edu 
          dokku letsencrypt:enable "$REVIEW_APP_NAME"
          
          EOF
