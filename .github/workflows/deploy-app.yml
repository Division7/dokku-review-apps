name: deploy-app.yml
on:
  workflow_call:
    inputs:
      template_app_name:
        required: true
        type: string
      docker_image:
        required: true
        type: string
      host_url:
        required: true
        type: string
    secrets:
      PORT:
        required: true
      SSH_USERNAME:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write
  actions: read
  contents: read
  pull-requests: read
  deployments: write

jobs:
  evaluate-queue:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_continue: ${{ steps.check-concurrency-group.outputs.should_continue }}
    steps:
      - name: Check Concurrency Group
        id: check-concurrency-group
        env:
          CONCURRENCY_GROUP: ${{ github.workflow }}-${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          CONCURRENCY_GROUPS=$(gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$REPO/actions/concurrency_groups/$CONCURRENCY_GROUP" | jq -r '.group_members | length')
           if [[ "$CONCURRENCY_GROUPS" -gt 1 ]]; then
            echo "::warning:: There are runs queued after this, exiting early."
            echo "should_continue=false" >> $GITHUB_OUTPUT
          else
            echo "should_continue=true" >> $GITHUB_OUTPUT
          fi

  create-deployment:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    needs: evaluate-queue
    if: ${{ needs.evaluate-queue.outputs.should_continue == 'true' }}
    steps:
      - name: Create Deployment
        id: create-deployment
        uses: chrnorm/deployment-action@v2
        with:
          auto-inactive: 'true'
          initial-status: 'in_progress'
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref }}
          environment-url: ${{ github.event.pull_request.head.repo.name }}-review-${{ github.event.pull_request.number }}.${{ inputs.host_url }}
          environment: ${{ github.event.pull_request.head.repo.name }}-review-${{ github.event.pull_request.number }}

  create-review-app:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      deployments: write
    needs:
      - evaluate-queue
      - create-deployment
    if: ${{ needs.evaluate-queue.outputs.should_continue == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install opkssh
        run: curl -sSLf https://raw.githubusercontent.com/openpubkey/opkssh/main/scripts/install-linux.sh | sudo bash

      - name: Login
        run: opkssh login github

      - name: SSH into server
        id: deploy
        env:
          HOST_URL: ${{ inputs.host_url }}
          PORT: ${{ secrets.PORT }}
          TEMPLATE_APP_NAME: ${{ inputs.template_app_name }}
          REVIEW_APP_NAME: ${{ github.event.pull_request.head.repo.name }}-review-${{ github.event.pull_request.number }}
          DOCKER_IMAGE: ${{ inputs.docker_image }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          ssh -o "StrictHostKeyChecking=accept-new" -p $PORT "$SSH_USERNAME@$HOST_URL" "deploy" "$TEMPLATE_APP_NAME" "$REVIEW_APP_NAME" "$DOCKER_IMAGE"

      - name: Report success
        if: ${{ steps.deploy.outcome == 'success' }}
        uses: chrnorm/deployment-status@v2
        with:
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}
          token: ${{ secrets.GITHUB_TOKEN }}
          state: 'success'

      - name: Report failure
        if: ${{ steps.deploy.outcome == 'failure' }}
        uses: chrnorm/deployment-status@v2
        with:
          deployment-id: ${{ needs.create-deployment.outputs.deployment_id }}
          token: ${{ secrets.GITHUB_TOKEN }}
          state: 'failure'