name: teardown-app.yml
on:
  workflow_call:
    inputs:
      host_url:
        required: true
        type: string
    secrets:
      PORT:
        required: true
      SSH_USERNAME:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write
  actions: read
  contents: read
  pull-requests: read
  deployments: write

jobs:
  evaluate-queue:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_continue: ${{ steps.check-concurrency-group.outputs.should_continue }}
    steps:
      - name: Check Concurrency Group
        id: check-concurrency-group
        env:
          CONCURRENCY_GROUP: ${{ github.workflow }}-${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONCURRENCY_GROUPS=$(gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$REPO/actions/concurrency_groups/$CONCURRENCY_GROUP" | jq -r '.group_members | length')
          if [[ "$CONCURRENCY_GROUPS" -gt 1 ]]; then
            echo "::warning:: There are runs queued after this, exiting early."
            echo "should_continue=false" >> $GITHUB_OUTPUT
          else
            echo "should_continue=true" >> $GITHUB_OUTPUT
          fi

  find-deployment:
   runs-on: ubuntu-latest
   permissions:
     deployments: write
   needs: evaluate-queue
   if: ${{ needs.evaluate-queue.outputs.should_continue == 'true' }}
   outputs:
     HAS_DEPLOYMENT: ${{ steps.identify-deployment.outputs.HAS_DEPLOYMENT }}
     DEPLOYMENT_NAME: ${{ steps.identify-deployment.outputs.DEPLOYMENT_NAME || '' }}
     DEPLOYMENT_ID: ${{ steps.identify-deployment.outputs.DEPLOYMENT_ID || '' }}
   steps:
     - name: Identify Deployment
       id: identify-deployment
       env:
         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         REF: ${{ github.head_ref || github.ref }}
         REPO: ${{ github.repository }}
       run: |
         DEPLOYMENTS=$(gh api \
         -H "Accept: application/vnd.github+json" \
         -H "X-GitHub-Api-Version: 2026-03-10" \
         "/repos/$REPO/deployments?ref=$REF")
         if [ "$(echo "$DEPLOYMENTS" | jq -r 'length')" == "0" ]; then
           echo "HAS_DEPLOYMENT=false" >> $GITHUB_OUTPUT
           exit 0
         fi
         DEPLOYMENT_ID=$(echo "$DEPLOYMENTS" | jq -r '.[0].id')
         DEPLOYMENT_NAME=$(echo "$DEPLOYMENTS" | jq -r '.[0].environment')
         echo "HAS_DEPLOYMENT=true" >> $GITHUB_OUTPUT
         echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
         echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME" >> $GITHUB_OUTPUT

  teardown-review-app:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      deployments: write
    needs:
      - evaluate-queue
      - find-deployment
    if: ${{ needs.evaluate-queue.outputs.should_continue == 'true' && needs.find-deployment.outputs.HAS_DEPLOYMENT == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install opkssh
        run: curl -sSLf https://raw.githubusercontent.com/openpubkey/opkssh/main/scripts/install-linux.sh | sudo bash

      - name: Login
        run: opkssh login github

      - name: SSH into server
        env:
          HOST_URL: ${{ inputs.host_url }}
          PORT: ${{ secrets.PORT }}
          APP_TO_TEARDOWN: ${{ needs.find-deployment.outputs.DEPLOYMENT_NAME }}
        run: |
          ssh -o "StrictHostKeyChecking=accept-new" -p $PORT "@$HOST_URL" "teardown" "$APP_TO_TEARDOWN"

      - name: Tear Down Deployment
        uses: chrnorm/deployment-status@v2
        with:
          deployment-id: ${{ needs.find-deployment.outputs.DEPLOYMENT_ID }}
          token: ${{ secrets.GITHUB_TOKEN }}
          state: 'inactive'

