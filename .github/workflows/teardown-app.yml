name: teardown-app.yml
on:
  workflow_call:
    inputs:
      app_to_teardown:
        required: true
        type: string
      docker_image:
        required: true
        type: string
    secrets:
      HOST_URL:
        required: true
      PORT:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

permissions:
  id-token: write
  actions: read
  contents: read
  pull-requests: read

jobs:
  evaluate-queue:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_continue: ${{ steps.check-concurrency-group.outputs.should_continue }}
    steps:
      - name: Check Concurrency Group
        id: check-concurrency-group
        env:
          CONCURRENCY_GROUP: ${{ github.workflow }}-${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          CONCURRENCY_GROUPS=$(gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10" "/repos/$REPO/actions/concurrency_groups/$CONCURRENCY_GROUP" | jq -r '.group_members | length')
          if [[ "$CONCURRENCY_GROUPS" -gt 1 ]]; then
            echo "::warning:: There are runs queued after this, exiting early."
            echo "should_continue=false" >> $GITHUB_OUTPUT"
          else
            echo "should_continue=true" >> $GITHUB_OUTPUT"
          fi

  create-review-app:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    needs: evaluate-queue
    if: ${{ needs.evaluate-queue.outputs.should_continue == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install opkssh
        run: curl -sSLf https://raw.githubusercontent.com/openpubkey/opkssh/main/scripts/install-linux.sh | sudo bash

      - name: Login
        run: opkssh login github

      - name: SSH into server
        env:
          HOST_URL: ${{ secrets.HOST_URL }}
          PORT: ${{ secrets.PORT }}
          APP_TO_TEARDOWN: ${{ inputs.app_to_teardown }}
        run: |
          ssh -o "StrictHostKeyChecking=accept-new" -p $PORT "dokkudeploy@$HOST_URL" "teardown" "$APP_TO_TEARDOWN"
